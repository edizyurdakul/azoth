name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run lint
      - run: bun run --filter '@azoth/tracker' build
      - run: bun run --filter '@azoth/dashboard-ui' build
      - run: bun run typecheck
      - run: bun run test
